[package]
name = "picoguard"
version = "0.1.0"
edition = "2024"
description = "DNS ad and malware blocker for 256 MB boards"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[[bin]]
name = "picoguard"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
log = "0.4.34"
lru = "0.19.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-gencat", "unicode-script", "perf-literal"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
webpki-roots = "1.0.11"
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
flate2 = "1.1.10"
hickory-proto = "0.26.3"
hyper = { version = "1.12.0", features = ["server"] }
proptest = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
