[package]
name = "picoguard"
version = "0.1.0"
edition = "2024"
description = "DNS ad and malware blocker for 256 MB boards"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[[bin]]
name = "picoguard"
path = "src/main.rs"

[dependencies]
log = "0.4.34"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-gencat", "unicode-script"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
flate2 = "1.1.10"
