name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  CARGO_ZIGBUILD_VERSION: 0.24.0

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          read -r type tag_object <<<"$ref"

          peeled=$tag_object
          if [ "$type" = tag ]; then
            peeled=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.sha)
          fi

          {
            scripts/release-preflight.sh "$TAG" "$type" "$peeled"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update \
            --component rustfmt --component clippy \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl \
            --target armv7-unknown-linux-musleabihf
          rustc --version
          cargo --version
          [[ $(rustc --version) == "rustc $RUSTUP_TOOLCHAIN "* ]]
          [[ $(cargo --version) == "cargo $RUSTUP_TOOLCHAIN "* ]]

      - name: Install zig
        run: |
          archive="zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://ziglang.org/download/$ZIG_VERSION/$archive"
          echo "$ZIG_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: |
          zig version
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Check the repository
        run: scripts/check.sh

      - name: Build the release assets
        run: scripts/build-release.sh

      - name: Check that the build left the lock file alone
        run: git diff --exit-code -- Cargo.lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: scripts/sign-release.sh dist/release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: scripts/publish-github-release.sh "$TAG" "$TAG_OBJECT" "$PRERELEASE" dist/release

  crate:
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc --version
          cargo --version
          [[ $(rustc --version) == "rustc $RUSTUP_TOOLCHAIN "* ]]
          [[ $(cargo --version) == "cargo $RUSTUP_TOOLCHAIN "* ]]

      - name: Check the package
        run: cargo package --locked

      - name: Publish to crates.io
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          CARGO_REGISTRY_TOKEN: ${{ needs.preflight.outputs.prerelease == 'false' && secrets.CARGO_REGISTRY_TOKEN || '' }}
        run: scripts/publish-crate.sh "$VERSION" "$PRERELEASE"
