<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picoguard</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f8; --card: #ffffff; --text: #16171a; --muted: #5f6672; --line: #e4e5e9;
  --accent: #4f46e5; --on-accent: #ffffff; --blocked: #dc2626; --good: #15803d; --warn: #b45309;
  --tint: #4f46e51f; --tint-bad: #dc26261a;
  --t-sm: 12px; --t-md: 14px; --t-lg: 18px; --t-xl: 34px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b; --card: #111114; --text: #ececf0; --muted: #9a9ea8; --line: #26272d;
    --accent: #818cf8; --on-accent: #09090b; --blocked: #f87171; --good: #4ade80; --warn: #fbbf24;
    --tint: #818cf833; --tint-bad: #f8717126;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%;
  font: var(--t-md)/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--s4); }
header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s1) var(--s3); padding-top: var(--s3); padding-bottom: var(--s3); }
h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
h1 small { margin-left: var(--s1); font-size: var(--t-sm); font-weight: 400; color: var(--muted); }
h2 { margin: 0 0 var(--s3); font-size: 13px; font-weight: 600; color: var(--muted); }
h2 small { font-weight: 400; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; font-size: var(--t-sm);
  font-weight: 500; white-space: nowrap; border: 1px solid var(--line); border-radius: 99px; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--muted)); }
#badge { --dot: var(--good); }
.paused #badge { --dot: var(--warn); }
#badge:empty { display: none; }
.r-pass { --dot: var(--accent); }
.r-cached { --dot: var(--good); }
.r-blocked_request, .r-blocked_response { --dot: var(--blocked); }
.r-error { --dot: var(--warn); }
#state { margin-left: auto; font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
#state.bad { color: var(--blocked); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav { display: flex; gap: var(--s1); margin: var(--s4) 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { margin-bottom: -1px; padding: var(--s2) var(--s3); border: 0; border-bottom: 2px solid transparent;
  border-radius: 0; background: none; color: var(--muted); font-weight: 500; }
nav button:hover { color: var(--text); background: none; }
nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
main { padding-bottom: var(--s5); }
.grid { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); }
.wide { grid-column: 1 / -1; }
section { min-width: 0; padding: var(--s4); background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 1px 2px #0000000d; }
code { display: block; font-size: 13px; word-break: break-all; }
#update { grid-column: 1 / -1; border-color: var(--accent); }
#update-notes, #install-state { overflow-wrap: anywhere; }
p { margin: 0 0 var(--s2); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4) var(--s3); }
.card span { display: block; font-size: var(--t-sm); color: var(--muted); }
.card b { display: block; font-size: var(--t-lg); font-weight: 600; font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere; }
.headline { grid-column: span 2; padding-bottom: var(--s4); border-bottom: 1px solid var(--line); }
.headline b { font-size: var(--t-xl); line-height: 1.2; letter-spacing: -.02em; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: var(--t-sm); color: var(--muted); white-space: nowrap; }
th, td { padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.name { overflow-wrap: anywhere; }
#queries td, #list-table td { white-space: nowrap; }
#list-table td.err { min-width: 14rem; white-space: normal; }
#queries td.name { min-width: 12rem; white-space: normal; }
.bars table { border-collapse: separate; border-spacing: 0 2px; }
.bars td { padding: 6px 0 6px var(--s2); border-bottom: 0; }
.bars td.name { border-radius: 4px;
  background: linear-gradient(to right, var(--bar, var(--tint)) var(--share, 0%), transparent 0); }
#top-blocked { --bar: var(--tint-bad); }
.bars th { padding-left: var(--s2); }
.bars td.num, .bars th:not(:first-child) { padding-right: var(--s2); text-align: right; }
#upstreams td, #upstreams th { padding-left: var(--s1); }
#upstreams td.num, #upstreams th:not(:first-child) { padding-right: var(--s1); }
.scroll { overflow-x: auto; }
#chart-readout { margin: 0 0 var(--s2); font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
#chart { display: block; }
#chart text { font-size: 10px; fill: var(--muted); }
#chart line { stroke: var(--line); }
#chart .base { stroke: var(--muted); }
#chart .total { fill: var(--accent); }
#chart .blocked { fill: var(--blocked); }
#chart .hit { fill: transparent; pointer-events: all; }
#chart .hit.on { fill: var(--tint); }
.pause { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.pause p { margin: 0 auto 0 0; flex: 1 1 12rem; font-size: 15px; }
.paused #pause { border-color: var(--warn); }
.paused #pause-text { color: var(--warn); font-weight: 600; }
#pause-form { display: flex; gap: var(--s2); }
#pause-error { flex: 1 0 100%; font-size: var(--t-sm); color: var(--blocked); }
input { width: 6.5rem; padding: 6px var(--s3); font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; }
button { font: inherit; padding: 6px var(--s3); border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); cursor: pointer; }
button:hover { background: var(--bg); }
button.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
button.go:hover { background: var(--accent); opacity: .9; }
#resume { display: none; }
.paused #resume { display: inline-block; }
.err { color: var(--warn); overflow-wrap: anywhere; }
.empty { color: var(--muted); }
.signed-out nav, .signed-out [data-panel], .signed-out #logout { display: none; }
#login { max-width: 22rem; margin: var(--s5) auto; }
#login-form { display: grid; gap: var(--s3); }
#login label { display: grid; gap: var(--s1); font-size: var(--t-sm); color: var(--muted); }
#login input { width: 100%; }
#login-note { margin: var(--s3) 0 0; }
@media (min-width: 720px) {
  .cards { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .headline { grid-column: span 3; }
}
</style>
</head>
<body class="signed-out">
<header>
  <div class="wrap">
    <h1>picoguard <small id="version"></small></h1>
    <span id="badge" class="badge"></span>
    <span id="state">connecting</span>
    <button id="logout" hidden>Sign out</button>
  </div>
</header>

<main class="wrap">
  <section id="login" class="wide" hidden>
    <h2>Sign in</h2>
    <form id="login-form">
      <label>User <input id="login-user" autocomplete="username" autocapitalize="none" required></label>
      <label>Password <input id="login-password" type="password" autocomplete="current-password" required></label>
      <button class="go">Sign in</button>
    </form>
    <p id="login-note" class="err"></p>
  </section>

  <nav role="tablist">
    <button role="tab" id="tab-dashboard" data-tab="dashboard" aria-controls="panel-dashboard" aria-selected="true">Dashboard</button>
    <button role="tab" id="tab-log" data-tab="log" aria-controls="panel-log" aria-selected="false">Query log</button>
    <button role="tab" id="tab-lists" data-tab="lists" aria-controls="panel-lists" aria-selected="false">Lists</button>
  </nav>

  <div class="grid" role="tabpanel" id="panel-dashboard" data-panel="dashboard" aria-labelledby="tab-dashboard">
    <section id="update" hidden>
      <h2>Update</h2>
      <p id="update-text"></p>
      <p id="update-notes"></p>
      <p id="install-state"></p>
      <button id="install" class="go" hidden>Update</button>
      <code id="update-how"></code>
    </section>

    <section id="limited" class="wide" hidden>
      <h2>Read-only</h2>
      <p id="limited-note"></p>
    </section>

    <section id="pause" class="wide">
      <div class="pause">
        <p id="pause-text">Blocking is on.</p>
        <button data-minutes="5">Pause 5 min</button>
        <button data-minutes="30">30 min</button>
        <button data-minutes="60">1 h</button>
        <button data-minutes="1440">1 day</button>
        <form id="pause-form" novalidate>
          <input id="pause-minutes" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="Minutes" aria-label="Minutes to pause">
          <button class="go">Pause</button>
        </form>
        <button id="resume" class="go">Resume</button>
        <span id="pause-error" hidden></span>
      </div>
    </section>

    <section class="wide">
      <h2>Totals</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section class="wide">
      <h2>Last 24 hours <small>(queries, blocked in red)</small></h2>
      <p id="chart-readout"></p>
      <svg id="chart" width="100%" height="150"></svg>
    </section>

    <div id="tops" class="grid wide bars">
      <section><h2>Top domains <small id="a-queried"></small></h2><div class="scroll" id="top-queried"></div></section>
      <section><h2>Top blocked <small id="a-blocked"></small></h2><div class="scroll" id="top-blocked"></div></section>
      <section><h2>Top clients <small id="a-clients"></small></h2><div class="scroll" id="top-clients"></div></section>
    </div>

    <section id="upstreams" class="wide bars">
      <h2>Upstreams <small>(since start)</small></h2>
      <div class="scroll" id="upstream-table"></div>
    </section>
  </div>

  <div class="grid" role="tabpanel" id="panel-log" data-panel="log" aria-labelledby="tab-log" hidden>
    <section class="wide">
      <h2>Recent queries</h2>
      <div class="scroll" id="queries"></div>
    </section>
  </div>

  <div class="grid" role="tabpanel" id="panel-lists" data-panel="lists" aria-labelledby="tab-lists" hidden>
    <section class="wide">
      <h2>Lists</h2>
      <div class="scroll" id="list-table"></div>
      <p id="refresh-row"><button id="refresh">Refresh all lists</button> <span id="refresh-note" class="empty"></span></p>
    </section>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const QTYPES = { 1: "A", 2: "NS", 5: "CNAME", 6: "SOA", 12: "PTR", 15: "MX", 16: "TXT",
  28: "AAAA", 33: "SRV", 64: "SVCB", 65: "HTTPS", 255: "ANY" };
const RESULTS = { pass: "upstream", cached: "cached", blocked_request: "blocked",
  blocked_response: "blocked (answer)", error: "error" };
const INSTALL_TEXT = {
  checking: () => "Checking the release...",
  downloading: (i) => "Downloading " + (i.bytes / 1048576).toFixed(1) + " MB...",
  verifying: () => "Verifying...",
  waiting: () => "Installing, picoguard restarts...",
  updated: (i) => "Updated to v" + i.version,
  rolled_back: (i) => "Rolled back: " + i.reason,
  failed: (i) => "Update failed: " + i.reason,
};
const SVG = $("chart").namespaceURI;
const CHART_HEIGHT = 150;
const CHART_TOP = 18;
const CHART_BASE = 132;
let pausedUntil = null;
let latestVersion = null;
let chartData = [];
let chartHour = null;
// Moves on every change of sign-in state, so an answer from before it never acts.
let authEpoch = 0;
// One sign-in or sign-out at a time: a late second sign-in would store a cookie again.
let authBusy = false;
let signedIn = false;

// Names and errors come from the network: only ever set as text.
function el(tag, text, className) {
  const node = document.createElement(tag);

  if (text !== undefined && text !== null) {
    node.textContent = text;
  }

  if (className) {
    node.className = className;
  }

  return node;
}

function table(head, rows) {
  const t = el("table");
  const tr = el("tr");
  head.forEach((h) => tr.append(el("th", h)));
  t.append(tr);
  rows.forEach((row) => t.append(row));

  return t;
}

function row(cells) {
  const tr = el("tr");
  cells.forEach(([text, className, badge]) => {
    const td = el("td", badge ? undefined : text, className);

    if (badge) {
      td.append(el("span", text, "badge " + badge));
    }

    tr.append(td);
  });

  return tr;
}

function duration(seconds) {
  if (seconds === null || seconds === undefined) {
    return "never";
  }

  if (seconds < 60) {
    return seconds + " s";
  }

  if (seconds < 3600) {
    return Math.floor(seconds / 60) + " min";
  }

  if (seconds < 86400) {
    return Math.floor(seconds / 3600) + " h " + Math.floor(seconds % 3600 / 60) + " min";
  }

  return Math.floor(seconds / 86400) + " d " + Math.floor(seconds % 86400 / 3600) + " h";
}

// The header tells the server not to answer 401 with the browser's own sign-in prompt.
async function api(path, body) {
  const options = { headers: { "X-Requested-With": "picoguard" } };

  if (body !== undefined) {
    options.method = "POST";
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }

  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const error = new Error(data.error || "HTTP " + response.status);
    error.status = response.status;
    throw error;
  }

  return data;
}

function showLogin(note) {
  authEpoch++;
  signedIn = false;
  document.body.classList.add("signed-out");
  $("login").hidden = false;
  $("logout").hidden = true;
  $("login-note").textContent = note;
  $("state").textContent = "signed out";
  $("state").className = "";
}

function sessionEnded() {
  showLogin(signedIn ? "Session ended, sign in again." : "");
}

function setBusy(busy) {
  authBusy = busy;
  $("logout").disabled = busy;
  $("login-form").querySelector("button").disabled = busy;
}

// The open tab lives only in the URL fragment. An unknown or hidden tab opens the first one.
function showTab() {
  const tabs = [...document.querySelectorAll("[data-tab]")];
  const open = tabs.find((tab) => tab.dataset.tab === location.hash.slice(1) && !tab.hidden) || tabs[0];
  tabs.forEach((tab) => tab.setAttribute("aria-selected", String(tab === open)));
  document.querySelectorAll("[data-panel]").forEach((panel) => {
    panel.hidden = panel.dataset.panel !== open.dataset.tab;
  });
}

function showCards(counters, percent) {
  const items = [
    ["Queries", counters.total], ["Blocked", percent + " %"],
    ["Blocked by name", counters.blocked_request], ["Blocked by answer", counters.blocked_response],
    ["Cached", counters.cached], ["Upstream", counters.upstream],
    ["Errors", counters.errors], ["Dropped", counters.dropped],
  ];
  $("cards").replaceChildren(...items.map(([label, value], i) => {
    const card = el("div", undefined, i < 2 ? "card headline" : "card");
    card.append(el("span", label), el("b", typeof value === "number" ? value.toLocaleString() : value));

    return card;
  }));
}

function svg(tag, attributes, text) {
  const node = document.createElementNS(SVG, tag);
  Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, value));

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

function hourOf(bucket) {
  return new Date(bucket.hour_start * 1000).getHours();
}

function chooseHour(i) {
  chartHour = chartData[i].hour_start;
  markHour();
}

// The chosen hour is kept by its start time, because the buckets shift left every hour. Once it
// has left the 24 hours, the newest hour shows again.
function markHour() {
  const found = chartData.findIndex((h) => h.hour_start === chartHour);
  const i = found < 0 ? chartData.length - 1 : found;
  const bucket = chartData[i];
  $("chart-readout").textContent = hourOf(bucket) + ":00 \u00b7 " + bucket.total.toLocaleString()
    + " queries \u00b7 " + bucket.blocked.toLocaleString() + " blocked";
  $("chart").querySelectorAll("[data-i]").forEach((hit) =>
    hit.classList.toggle("on", Number(hit.dataset.i) === i));
}

// x and width are percentages and y and height are pixels, so the bars stretch to any width
// while the axis text keeps its size.
function showChart(hourly) {
  chartData = hourly;
  const peak = Math.max(0, ...hourly.map((h) => h.total));
  const room = CHART_BASE - CHART_TOP;
  const slot = 100 / hourly.length;
  const parts = [
    svg("line", { x1: 0, x2: "100%", y1: CHART_TOP, y2: CHART_TOP }),
    svg("line", { class: "base", x1: 0, x2: "100%", y1: CHART_BASE, y2: CHART_BASE }),
    svg("text", { x: 0, y: CHART_TOP - 5 }, peak.toLocaleString()),
  ];
  hourly.forEach((h, i) => {
    const height = h.total / Math.max(1, peak) * room;
    const bar = { x: (i + .15) * slot + "%", width: slot * .7 + "%", rx: 2 };
    const blockedHeight = h.total ? h.blocked / h.total * height : 0;
    parts.push(
      svg("rect", { ...bar, class: "total", y: CHART_BASE - height, height }),
      svg("rect", { ...bar, class: "blocked", y: CHART_BASE - blockedHeight, height: blockedHeight }));

    if (i % 4 === 0) {
      parts.push(svg("text", { x: (i + .5) * slot + "%", y: CHART_HEIGHT - 2, "text-anchor": "middle" }, hourOf(h)));
    }
  });
  hourly.forEach((h, i) => {
    const hit = svg("rect", { class: "hit", "data-i": i, x: i * slot + "%", y: 0,
      width: slot + "%", height: CHART_HEIGHT });
    hit.addEventListener("pointerover", () => chooseHour(i));
    hit.addEventListener("click", () => chooseHour(i));
    parts.push(hit);
  });
  $("chart").replaceChildren(...parts);
  markHour();
}

// A name that took over another one's slot inherited that count. If it was seen only once
// for sure (count - max_error is 1), the entry says nothing yet and is left out.
function worthShowing(entry) {
  return entry.max_error === 0 || entry.count - entry.max_error > 1;
}

function showTop(id, noteId, top, name) {
  $(noteId).textContent = top.approximate ? "(approximate)" : "";
  const shown = top.entries.filter(worthShowing).slice(0, 10);
  const rows = shown.map((e) => {
    const exact = e.max_error === 0;
    const count = el("td", (exact ? "" : "~") + e.count.toLocaleString(), "num");

    if (!exact) {
      count.title = "may be too high by up to " + e.max_error;
    }

    const key = el("td", e.key, "name");
    key.style.setProperty("--share", e.count / shown[0].count * 100 + "%");
    const tr = el("tr");
    tr.append(key, count);

    return tr;
  });
  $(id).replaceChildren(rows.length ? table([name, "Queries"], rows) : el("p", "Nothing yet.", "empty"));
}

function showQueries(entries) {
  const rows = entries.map((e) => {
    const time = new Date(e.time * 1000).toLocaleTimeString();
    const result = RESULTS[e.result] || e.result;
    const ms = e.latency_us < 1000 ? "<1" : Math.round(e.latency_us / 1000);

    return row([[time], [e.client], [e.qname, "name"], [QTYPES[e.qtype] || e.qtype],
      [result, "", "r-" + e.result], [e.upstream === null ? "" : "#" + e.upstream], [ms + " ms", "num"]]);
  });
  $("queries").replaceChildren(rows.length
    ? table(["Time", "Client", "Name", "Type", "Result", "Via", "Time taken"], rows)
    : el("p", "No queries yet.", "empty"));
}

function showLists(lists) {
  const rows = lists.map((l) => row([
    [l.name, "name"], [l.kind], [l.format || "-"], [l.rules.toLocaleString(), "num"],
    [duration(l.age_seconds), "num"], [l.last_error || "", "err"],
  ]));
  $("list-table").replaceChildren(rows.length
    ? table(["Name", "Kind", "Format", "Rules", "Checked", "Last error"], rows)
    : el("p", "No lists configured.", "empty"));
}

function showUpstreams(upstreams) {
  const answeredTotal = upstreams.reduce((sum, u) => sum + u.answered, 0);
  const rows = upstreams.slice().sort((a, b) => b.answered - a.answered || a.failed - b.failed).map((u) => {
    const share = answeredTotal ? u.answered / answeredTotal * 100 : 0;
    const tr = row([
      [(u.kind === "local" ? "local: " : "") + u.label, "name"], [u.answered.toLocaleString(), "num"],
      [share.toFixed(1) + " %", "num"], [u.failed.toLocaleString(), u.failed ? "num err" : "num"],
      [u.avg_ms === null ? "\u2014" : u.avg_ms.toFixed(1) + " ms", "num"],
    ]);
    tr.firstChild.style.setProperty("--share", share + "%");

    return tr;
  });
  $("upstream-table").replaceChildren(table(["Server", "Answered", "Share", "Failed", "Avg"], rows));
}

function showPause(pause) {
  pausedUntil = pause.paused ? pause.until : null;
  document.body.classList.toggle("paused", pause.paused);
  $("badge").textContent = pause.paused ? "Paused" : "Blocking on";
  tick();
}

function tick() {
  const left = pausedUntil === null ? 0 : pausedUntil - Math.floor(Date.now() / 1000);
  $("pause-text").textContent = left > 0
    ? "Blocking is paused for " + duration(left) + " more."
    : "Blocking is on.";
}

function showUpdate(status) {
  $("version").textContent = "v" + status.version;
  $("update").hidden = !status.update.latest && !status.update.install;
  $("update-text").textContent = status.update.latest ? "update available: v" + status.update.latest : "";
  $("update-notes").textContent = status.update.notes || "";
  $("update-notes").hidden = !status.update.notes;
  $("update-how").textContent = status.update.how || "";
  showInstall(status.update);
}

function showInstall(update) {
  const install = update.install;
  latestVersion = update.latest || null;
  $("install-state").textContent = install ? (INSTALL_TEXT[install.state] || (() => ""))(install) : "";
  $("install").hidden = !update.can_install;

  if (update.can_install) {
    $("install").textContent = "Update to v" + latestVersion;
  }
}

// Without a password the server answers 403 to everything but totals and lists.
function showLimited(note) {
  $("limited-note").textContent = note || "";
  $("limited").hidden = !note;
  ["pause", "tops", "upstreams", "tab-log", "refresh-row"].forEach((id) => { $(id).hidden = Boolean(note); });
  showTab();
}

async function update() {
  if (!$("login").hidden) {
    return;
  }

  const epoch = authEpoch;

  try {
    const status = await api("/api/status");

    if (epoch !== authEpoch) {
      return;
    }

    signedIn = true;
    document.body.classList.remove("signed-out");
    $("logout").hidden = Boolean(status.limited);
    showUpdate(status);
    showLimited(status.limited);
    showPause(status.pause);
    showCards(status.counters, status.blocked_percent);
    showChart(status.hourly);
    showLists(status.lists);

    if (!status.limited) {
      showUpstreams(status.upstreams);
      const log = await api("/api/querylog?limit=50");

      if (epoch !== authEpoch) {
        return;
      }

      showTop("top-queried", "a-queried", status.top_queried, "Domain");
      showTop("top-blocked", "a-blocked", status.top_blocked, "Domain");
      showTop("top-clients", "a-clients", status.top_clients, "Client");
      showQueries(log.entries);
    }

    $("state").textContent = "updated " + new Date().toLocaleTimeString();
    $("state").className = "";
  } catch (error) {
    if (epoch !== authEpoch) {
      return;
    }

    if (error.status === 401) {
      sessionEnded();

      return;
    }

    $("state").textContent = "no connection: " + error.message;
    $("state").className = "bad";
  }
}

async function act(path, body, note) {
  const epoch = authEpoch;

  try {
    await api(path, body);

    if (epoch !== authEpoch) {
      return;
    }

    if (note) {
      $("refresh-note").textContent = note;
    }
  } catch (error) {
    if (epoch !== authEpoch) {
      return;
    }

    if (error.status === 401) {
      sessionEnded();

      return;
    }

    $("state").textContent = error.message;
    $("state").className = "bad";
  }

  update();
}

document.querySelectorAll("[data-tab]").forEach((tab) =>
  tab.addEventListener("click", () => { location.hash = tab.dataset.tab; }));
window.addEventListener("hashchange", showTab);
document.querySelectorAll("button[data-minutes]").forEach((button) =>
  button.addEventListener("click", () =>
    act("/api/pause", { minutes: Number(button.dataset.minutes) })));
$("pause-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const minutes = Number($("pause-minutes").value);
  const valid = Number.isInteger(minutes) && minutes >= 1 && minutes <= 1440;
  $("pause-error").hidden = valid;

  if (valid) {
    act("/api/pause", { minutes });
  } else {
    $("pause-error").textContent = "1 to 1440 minutes";
  }
});
$("resume").addEventListener("click", () => act("/api/resume", {}));
$("install").addEventListener("click", () => {
  if (confirm("Install v" + latestVersion + "? picoguard restarts.")) {
    act("/api/update", { version: latestVersion });
  }
});
$("refresh").addEventListener("click", () =>
  act("/api/lists/refresh", {}, "Refresh started; the table updates as lists finish."));
$("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();

  if (authBusy) {
    return;
  }

  setBusy(true);
  const epoch = ++authEpoch;

  try {
    await api("/api/login", { user: $("login-user").value, password: $("login-password").value });

    if (epoch !== authEpoch) {
      return;
    }

    authEpoch++;
    $("login-password").value = "";
    $("login").hidden = true;
    update();
  } catch (error) {
    if (epoch !== authEpoch) {
      return;
    }

    authEpoch++;
    $("login-note").textContent = error.message;
  } finally {
    setBusy(false);
  }
});
$("logout").addEventListener("click", async () => {
  if (authBusy) {
    return;
  }

  setBusy(true);
  const epoch = ++authEpoch;

  try {
    await api("/api/logout", {});

    if (epoch === authEpoch) {
      showLogin("");
    }
  } catch (error) {
    if (epoch !== authEpoch) {
      return;
    }

    if (error.status === 401) {
      showLogin("");

      return;
    }

    authEpoch++;
    $("state").textContent = error.message;
    $("state").className = "bad";
  } finally {
    setBusy(false);
  }
});

showTab();
update();
setInterval(update, 5000);
setInterval(tick, 1000);
</script>
</body>
</html>
